<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="새로운 서비스를 만드는 김민석의 소개 페이지입니다." />
    <meta name="theme-color" content="#0b6fb8" />
    <title>김민석 | 소개</title>

    <!-- 한글 가독성이 좋은 Pretendard 웹폰트 (필요한 글자만 내려받는 서브셋) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 키보드·화면낭독기 사용자를 위한 건너뛰기 링크 -->
    <a class="skip-link" href="#main">본문 바로가기</a>

    <header class="site-header">
      <nav class="nav container" aria-label="주 메뉴">
        <a class="logo" href="#intro">김민석</a>
        <ul class="menu">
          <li><a href="#intro">소개</a></li>
          <li><a href="#work">작업</a></li>
          <li><a href="#contact">연락처</a></li>
        </ul>
      </nav>
    </header>

    <main id="main">
      <!-- 소개(히어로) -->
      <section id="intro" class="hero container" aria-labelledby="intro-title">
        <div class="hero__text">
          <p class="eyebrow">Service Maker</p>
          <h1 id="intro-title">김민석</h1>
          <p class="lead">새로운 서비스를 제작합니다. 화이팅~</p>
          <a class="btn" href="#contact">문의 남기기</a>
        </div>

        <figure class="hero__media">
          <img
            src="image.png"
            alt="갈림길에서 많은 사람들과 다른 방향으로 홀로 걸어가는 한 사람"
            width="776"
            height="594"
          />
        </figure>
      </section>

      <!-- 작업 -->
      <section id="work" class="section container" aria-labelledby="work-title">
        <h2 id="work-title" class="section__title">작업</h2>

        <div class="cards">
          <article class="card">
            <h3>개인 소개 페이지</h3>
            <p>HTML만으로 만든 첫 페이지입니다.</p>
          </article>

          <article class="card">
            <h3>회원가입 폼</h3>
            <p>입력 요소와 기본 검증을 연습했습니다.</p>
          </article>

          <article class="card">
            <h3>시맨틱 구조 정리</h3>
            <p>검색엔진과 화면낭독기를 고려했습니다.</p>
          </article>

          <article class="card">
            <span class="badge">NEW</span>
            <h3>CSS 상자모델</h3>
            <p>HTML 요소는 margin, border, padding, content로 구성되어 있습니다.</p>
          </article>
        </div>
      </section>

      <!-- 연락처 -->
      <section id="contact" class="section container" aria-labelledby="contact-title">
        <h2 id="contact-title" class="section__title">연락처</h2>

        <form class="contact-form" action="/contact" method="post">
          <fieldset>
            <legend>문의 남기기</legend>

            <div class="field">
              <label for="name">이름</label>
              <input
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                placeholder="홍길동"
                required
              />
            </div>

            <div class="field">
              <label for="message">내용</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="문의하실 내용을 적어 주세요."
                required
              ></textarea>
            </div>

            <button class="btn" type="submit">보내기</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p class="container"><small>&copy; 2026 김민석</small></p>
    </footer>
  </body>
</html>
